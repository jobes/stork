name: 🐛 Bug Report
description: Report a bug or unexpected behaviour in Stork.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please search
        existing issues first to avoid duplicates.
  - type: input
    id: version
    attributes:
      label: App version
      description: Which version of Stork are you using? (e.g. 0.1.0+1)
      placeholder: "0.1.0+1"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform did you experience the bug on?
      multiple: true
      options:
        - Android
        - iOS
        - Linux
        - macOS
        - Windows
        - Web
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: "What happened, and what did you expect to happen?"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Open the map
        2. Enable follow mode
        3. ...
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened? Include error messages, logs, or screenshots if possible.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other relevant information (device model, OS version, network conditions, connected avionics, etc.).
