<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Stork">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Stork</title>
  <link rel="manifest" href="manifest.json">
  <script src='https://unpkg.com/maplibre-gl@^5.0/dist/maplibre-gl.js'></script>
  <link href='https://unpkg.com/maplibre-gl@^5.0/dist/maplibre-gl.css' rel='stylesheet'/>
  <script src='https://unpkg.com/pmtiles@^4.0/dist/pmtiles.js'></script>
  <script>
    const originalFetch = window.fetch;
    window.fetch = async function(resource, options) {
      if (options && options.headers) {
        const headers = new Headers(options.headers);
        const range = headers.get('range') || headers.get('Range');
        
        if (range) {
          const urlStr = typeof resource === 'string' ? resource : resource?.url;
          if (urlStr && (urlStr.includes('nocors.php'))) {
            try {
              const url = new URL(urlStr, window.location.origin);
              url.searchParams.set('headers', JSON.stringify({ Range: range }));
              
              headers.delete('range');
              headers.delete('Range');
              
              const newOptions = { ...options, headers };
              return originalFetch(url.toString(), newOptions);
            } catch (e) {
              console.error('Fetch intercept error:', e);
            }
          }
        }
      }
      return originalFetch(resource, options);
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
